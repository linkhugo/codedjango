---
# Variables para ha_setup.yml
#
# Credenciales en vault (definir en group_vars/all.vault.yml o similar):
#   ha_user:     "admin"
#   ha_password: "secret"

# ── Conexión iControlREST ─────────────────────────────────────────────────────
f5_api_port:       443
f5_validate_certs: false
f5_auth_provider:  "tmos"

# ── Device group ──────────────────────────────────────────────────────────────
ha_device_group:      "Device-Group-HA"
ha_auto_sync:         false   # true | false
ha_save_on_auto_sync: false   # true solo si ha_auto_sync: true

# ── Puerto de failover unicast (UDP) ──────────────────────────────────────────
ha_failover_port: 1026

# ── Equipo primario (recibe MAC masquerade) ───────────────────────────────────
ha_primary:
  host:        "bigip-primary.corp.local"   # hostname o IP de mgmt (para API y provider)
  failover_ip: "10.0.0.1"                   # IP de heartbeat unicast — siempre una IP
  # MAC masquerade se calcula automáticamente desde la MAC base del equipo (KB K3523)

# ── Equipo secundario ─────────────────────────────────────────────────────────
ha_secondary:
  host:        "bigip-secondary.corp.local"
  failover_ip: "10.0.0.2"

# ── VLANs con FailSafe ────────────────────────────────────────────────────────
# failsafe_action: failover | reboot | restart-all
# failsafe_timeout: segundos antes de activar la acción (default F5: 90)
ha_vlans:
  - name:             "vlan-interna"
    failsafe:         "enabled"
    failsafe_action:  "failover"
    failsafe_timeout: 90

# ── Vars planas para Jenkins (Invoke Ansible Playbook → Extra Variables) ──────
# Si se definen, sobreescriben los valores de ha_primary/ha_secondary.
# Dejar vacías ("") para usar los valores del dict de arriba.
# ha_primary_host / ha_secondary_host     → hostname o IP de gestión
# ha_primary_failover_ip / ha_secondary_failover_ip → IP de heartbeat (siempre una IP)
ha_primary_host:          ""
ha_primary_failover_ip:   ""
ha_secondary_host:        ""
ha_secondary_failover_ip: ""
