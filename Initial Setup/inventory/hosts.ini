# La entidad se pasa al ejecutar con -e entity=<MEX|USA|PER>, que carga
# entities/<entity>.yml. Ejecuta una corrida por entidad, acotando con --limit
# a los hosts de esa entidad. Ejemplo:
#   ansible-playbook setup.yml -e entity=MEX --limit mex-lb01 --ask-vault-pass
[f5_devices]
mex-lb01   ansible_host=10.1.1.10
usa-lb01   ansible_host=10.2.1.10
per-lb01   ansible_host=10.3.1.10

[f5_devices:vars]
# Conexion local: el controller hace llamadas HTTPS directas a la API de F5.
# No se requiere SSH al dispositivo.
ansible_connection=local
ansible_user=admin
# ansible_password se define en group_vars/f5_devices.vault.yml (encriptado con ansible-vault)
