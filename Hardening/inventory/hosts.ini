[f5_devices]
test01   ansible_host=192.168.1.100

[f5_devices:vars]
# Conexion local: el controller hace llamadas HTTPS directas a la API de F5.
# No se requiere SSH al dispositivo.
ansible_connection=local
ansible_user=admin
# ansible_password se define en group_vars/f5_devices.vault.yml (encriptado con ansible-vault)
