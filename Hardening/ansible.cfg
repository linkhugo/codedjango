[defaults]
# Inventory por defecto
inventory           = inventory/hosts.ini

# No recolectar facts automaticamente; cada play lo controla con gather_facts
gathering           = explicit

# Roles resueltos relativo al directorio del playbook
roles_path          = .

# Salida legible en multiples hosts
stdout_callback     = yaml

# Suprimir warnings de deprecacion
deprecation_warnings = False

# Timeout de conexion SSH
timeout             = 30

